font_family JetBrainsMono Nerd Font
font_size 10.0

background #1e1e2e
foreground #cdd6f4
color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #cba6f7
color6 #94e2d5
color7 #bac2de
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #cba6f7
color14 #94e2d5
color15 #a6adc8
selection_background #313244
selection_foreground #cdd6f4
cursor #f5e0dc
cursor_text_color #1e1e2e

# ============================================
# TRANSPARÊNCIA - MAIS TRANSPARENTE
# ============================================
background_opacity 0.92
background_blur 15

# ============================================
# JANELA - SEM PADDING
# ============================================
enabled_layouts all
confirm_quit no

# ZERA O PADDING (tudo nas paredes)
window_padding_width 0
window_padding_height 0

# Tamanho da janela (opcional)
initial_window_width 900
initial_window_height 600

# ============================================
# REMOTE CONTROL (para nnn)
# ============================================
allow_remote_control yes
listen_on unix:/tmp/kitty

# ============================================
# SCROLLBACK
# ============================================
scrollback_lines 10000

# ============================================
# ATALHOS
# ============================================
map ctrl+shift+enter new_window
map ctrl+shift+n new_os_window
map ctrl+shift+right next_window
map ctrl+shift+left previous_window
map ctrl+shift+l next_layout
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+r load_config_file

# ============================================
# BORDAS - FINAS
# ============================================
active_border_color #89b4fa
inactive_border_color #313244
border_width 1